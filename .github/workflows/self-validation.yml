name: Self Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install and verify actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" "$base/$archive"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$archive" \
            | (cd "$RUNNER_TEMP" && sha256sum --check --strict -)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=

  universal-ci:
    name: Universal CI smoke test
    uses: ./.github/workflows/universal-ci.yml

  universal-cd-disabled:
    name: Universal CD disabled smoke test
    uses: ./.github/workflows/universal-cd.yml
    with:
      enabled: false
      dry_run: true

  self-validation:
    name: Self Validation
    needs: [actionlint, universal-ci, universal-cd-disabled]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify complete self validation
        shell: bash
        env:
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          UNIVERSAL_CI_RESULT: ${{ needs.universal-ci.result }}
          UNIVERSAL_CD_RESULT: ${{ needs.universal-cd-disabled.result }}
        run: |
          set -euo pipefail
          for result in "$ACTIONLINT_RESULT" "$UNIVERSAL_CI_RESULT" "$UNIVERSAL_CD_RESULT"; do
            if test "$result" != success; then
              echo "Self Validation failed because a required validation job did not succeed." >&2
              exit 1
            fi
          done
          echo "Self Validation passed."
