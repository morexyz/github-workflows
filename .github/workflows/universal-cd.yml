name: Universal CD

on:
  workflow_call:
    inputs:
      enabled:
        description: Explicit opt-in switch. Disabled calls do not deploy.
        required: false
        type: boolean
        default: false
      dry_run:
        description: Validate deployment configuration without executing repository deployment hooks.
        required: false
        type: boolean
        default: true
      environment_name:
        description: GitHub Environment used for a real deployment.
        required: false
        type: string
        default: production
      allowed_environments:
        description: Comma-separated allowlist for real deployment environments.
        required: false
        type: string
        default: production
      shared_target:
        description: Set true only when multiple repositories may deploy to the same external target.
        required: false
        type: boolean
        default: false
      external_lock_confirmed:
        description: Required for shared_target=true; confirms the repository deploy hook enforces an external cross-repository lock.
        required: false
        type: boolean
        default: false
      working_directory:
        description: Repository-relative directory containing deployment hooks.
        required: false
        type: string
        default: '.'
      predeploy_script:
        description: Optional repository-relative pre-deployment hook, relative to working_directory.
        required: false
        type: string
        default: scripts/predeploy.sh
      deploy_script:
        description: Required repository-relative deployment hook, relative to working_directory.
        required: false
        type: string
        default: scripts/deploy.sh
      healthcheck_script:
        description: Optional repository-relative post-deployment health-check hook, relative to working_directory.
        required: false
        type: string
        default: scripts/healthcheck.sh
      deploy_host:
        description: Optional non-secret deployment host; falls back to vars.DEPLOY_HOST.
        required: false
        type: string
        default: ''
      deploy_user:
        description: Optional non-secret deployment user; falls back to vars.DEPLOY_USER.
        required: false
        type: string
        default: ''
      deploy_path:
        description: Optional non-secret deployment path; falls back to vars.DEPLOY_PATH.
        required: false
        type: string
        default: ''
      deploy_url:
        description: Optional non-secret deployment URL; falls back to vars.DEPLOY_URL.
        required: false
        type: string
        default: ''
    secrets:
      DEPLOY_TOKEN:
        description: Optional generic deployment token.
        required: false
      DEPLOY_PASSWORD:
        description: Optional generic deployment password.
        required: false
      DEPLOY_SSH_KEY:
        description: Optional SSH private key for repository deployment hooks.
        required: false
      DEPLOY_CREDENTIALS:
        description: Optional opaque credentials payload for repository deployment hooks.
        required: false
    outputs:
      deployed:
        description: true only when a real deployment job completed successfully.
        value: ${{ jobs.summary.outputs.deployed }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate deployment request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Validate Universal CD inputs
        shell: bash
        env:
          ENABLED: ${{ inputs.enabled }}
          DRY_RUN: ${{ inputs.dry_run }}
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          ALLOWED_ENVIRONMENTS: ${{ inputs.allowed_environments }}
          SHARED_TARGET: ${{ inputs.shared_target }}
          EXTERNAL_LOCK_CONFIRMED: ${{ inputs.external_lock_confirmed }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          PREDEPLOY_SCRIPT: ${{ inputs.predeploy_script }}
          DEPLOY_SCRIPT: ${{ inputs.deploy_script }}
          HEALTHCHECK_SCRIPT: ${{ inputs.healthcheck_script }}
        run: |
          set -euo pipefail

          validate_relative_path() {
            local value="$1"
            local label="$2"

            test -n "$value" || {
              echo "$label must not be empty." >&2
              exit 1
            }

            case "$value" in
              /*)
                echo "$label must be repository-relative: $value" >&2
                exit 1
                ;;
            esac

            case "/$value/" in
              */../*)
                echo "$label must not contain '..' path segments: $value" >&2
                exit 1
                ;;
            esac
          }

          test -n "$ENVIRONMENT_NAME" || {
            echo "environment_name must not be empty." >&2
            exit 1
          }

          validate_relative_path "$WORKING_DIRECTORY" "working_directory"
          validate_relative_path "$DEPLOY_SCRIPT" "deploy_script"

          if test -n "$PREDEPLOY_SCRIPT"; then
            validate_relative_path "$PREDEPLOY_SCRIPT" "predeploy_script"
          fi
          if test -n "$HEALTHCHECK_SCRIPT"; then
            validate_relative_path "$HEALTHCHECK_SCRIPT" "healthcheck_script"
          fi

          test -d "$WORKING_DIRECTORY" || {
            echo "working_directory does not exist: $WORKING_DIRECTORY" >&2
            exit 1
          }

          if test "$ENABLED" = true; then
            allowed=false
            IFS=',' read -r -a allowed_items <<< "$ALLOWED_ENVIRONMENTS"
            for raw_item in "${allowed_items[@]}"; do
              item="${raw_item#"${raw_item%%[![:space:]]*}"}"
              item="${item%"${item##*[![:space:]]}"}"
              if test "$item" = "$ENVIRONMENT_NAME"; then
                allowed=true
                break
              fi
            done

            if test "$allowed" != true; then
              echo "environment_name '$ENVIRONMENT_NAME' is not in allowed_environments." >&2
              exit 1
            fi

            if test "$SHARED_TARGET" = true && test "$EXTERNAL_LOCK_CONFIRMED" != true; then
              echo "shared_target=true requires external_lock_confirmed=true because GitHub concurrency groups do not serialize deployments across repositories." >&2
              exit 1
            fi

            test -f "$WORKING_DIRECTORY/$DEPLOY_SCRIPT" || {
              echo "Required deploy hook not found: $WORKING_DIRECTORY/$DEPLOY_SCRIPT" >&2
              exit 1
            }
          fi

          echo "Universal CD request validated. enabled=$ENABLED dry_run=$DRY_RUN environment=$ENVIRONMENT_NAME"

  disabled:
    name: Deployment disabled
    needs: validate
    if: inputs.enabled == false
    runs-on: ubuntu-latest
    steps:
      - name: Report disabled deployment
        run: echo "Universal CD is disabled. No deployment was attempted."

  dry-run:
    name: Deployment dry run
    needs: validate
    if: inputs.enabled && inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show deployment plan
        shell: bash
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          PREDEPLOY_SCRIPT: ${{ inputs.predeploy_script }}
          DEPLOY_SCRIPT: ${{ inputs.deploy_script }}
          HEALTHCHECK_SCRIPT: ${{ inputs.healthcheck_script }}
        run: |
          set -euo pipefail
          echo "Dry run only; no deployment hook will execute."
          echo "Environment: $ENVIRONMENT_NAME"
          echo "Working directory: $WORKING_DIRECTORY"
          echo "Deploy hook: $DEPLOY_SCRIPT"
          if test -n "$PREDEPLOY_SCRIPT" && test -f "$WORKING_DIRECTORY/$PREDEPLOY_SCRIPT"; then
            echo "Pre-deploy hook detected: $PREDEPLOY_SCRIPT"
          fi
          if test -n "$HEALTHCHECK_SCRIPT" && test -f "$WORKING_DIRECTORY/$HEALTHCHECK_SCRIPT"; then
            echo "Health-check hook detected: $HEALTHCHECK_SCRIPT"
          fi

  deploy:
    name: Deploy to ${{ inputs.environment_name }}
    needs: validate
    if: inputs.enabled && inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment_name }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.environment_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Run optional pre-deployment hook
        if: inputs.predeploy_script != ''
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          PREDEPLOY_SCRIPT: ${{ inputs.predeploy_script }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment_name }}
          DEPLOY_HOST: ${{ inputs.deploy_host || vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ inputs.deploy_user || vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ inputs.deploy_path || vars.DEPLOY_PATH }}
          DEPLOY_URL: ${{ inputs.deploy_url || vars.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_CREDENTIALS: ${{ secrets.DEPLOY_CREDENTIALS }}
        run: |
          set -euo pipefail
          if test -f "$PREDEPLOY_SCRIPT"; then
            bash -- "$PREDEPLOY_SCRIPT"
          else
            echo "No pre-deployment hook found; continuing."
          fi

      - name: Run deployment hook
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          DEPLOY_SCRIPT: ${{ inputs.deploy_script }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment_name }}
          DEPLOY_HOST: ${{ inputs.deploy_host || vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ inputs.deploy_user || vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ inputs.deploy_path || vars.DEPLOY_PATH }}
          DEPLOY_URL: ${{ inputs.deploy_url || vars.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_CREDENTIALS: ${{ secrets.DEPLOY_CREDENTIALS }}
        run: |
          set -euo pipefail
          bash -- "$DEPLOY_SCRIPT"

      - name: Run optional health check
        if: inputs.healthcheck_script != ''
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          HEALTHCHECK_SCRIPT: ${{ inputs.healthcheck_script }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment_name }}
          DEPLOY_HOST: ${{ inputs.deploy_host || vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ inputs.deploy_user || vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ inputs.deploy_path || vars.DEPLOY_PATH }}
          DEPLOY_URL: ${{ inputs.deploy_url || vars.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_CREDENTIALS: ${{ secrets.DEPLOY_CREDENTIALS }}
        run: |
          set -euo pipefail
          if test -f "$HEALTHCHECK_SCRIPT"; then
            bash -- "$HEALTHCHECK_SCRIPT"
          else
            echo "No health-check hook found; continuing."
          fi

  summary:
    name: Universal CD summary
    needs: [validate, disabled, dry-run, deploy]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.result.outputs.deployed }}
    steps:
      - id: result
        name: Verify deployment result
        shell: bash
        env:
          VALIDATE: ${{ needs.validate.result }}
          DISABLED: ${{ needs.disabled.result }}
          DRY_RUN: ${{ needs.dry-run.result }}
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail

          for result in "$VALIDATE" "$DISABLED" "$DRY_RUN" "$DEPLOY"; do
            if test "$result" = failure || test "$result" = cancelled; then
              echo "Universal CD failed." >&2
              exit 1
            fi
          done

          if test "$DEPLOY" = success; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            echo "Universal CD completed a real deployment successfully."
          else
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "Universal CD completed without a real deployment."
          fi
