name: Universal CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version for JavaScript/TypeScript projects
        required: false
        type: string
        default: '22'
      pnpm-version:
        description: Stable pnpm fallback when package.json does not pin packageManager
        required: false
        type: string
        default: '10.26.1'
      yarn-version:
        description: Stable Yarn fallback when package.json does not pin packageManager
        required: false
        type: string
        default: '1.22.22'
      bun-version:
        description: Stable Bun fallback when package.json does not pin packageManager
        required: false
        type: string
        default: '1.2.22'
      corepack-version:
        description: Corepack version installed when Node.js does not bundle Corepack
        required: false
        type: string
        default: '0.34.0'
      python-version:
        description: Python version for Python projects (3.8+)
        required: false
        type: string
        default: '3.12'
      php-version:
        description: PHP version for PHP projects
        required: false
        type: string
        default: '8.3'
      go-version:
        description: Go version for Go projects
        required: false
        type: string
        default: '1.24.x'
      rust-toolchain:
        description: Rust toolchain
        required: false
        type: string
        default: 'stable'

permissions:
  contents: read

jobs:
  detect:
    name: Detect project type
    runs-on: ubuntu-latest
    outputs:
      custom: ${{ steps.detect.outputs.custom }}
      node: ${{ steps.detect.outputs.node }}
      php: ${{ steps.detect.outputs.php }}
      python: ${{ steps.detect.outputs.python }}
      go: ${{ steps.detect.outputs.go }}
      rust: ${{ steps.detect.outputs.rust }}
      foundry: ${{ steps.detect.outputs.foundry }}
    steps:
      - uses: actions/checkout@v5
      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          emit() {
            local key="$1"
            local value="$2"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
          }

          test -f scripts/ci.sh && emit custom true || emit custom false
          test -f package.json && emit node true || emit node false
          test -f composer.json && emit php true || emit php false
          if test -f pyproject.toml || test -f requirements.txt || test -f requirements-dev.txt || test -f setup.py || test -f setup.cfg; then
            emit python true
          else
            emit python false
          fi
          test -f go.mod && emit go true || emit go false
          test -f Cargo.toml && emit rust true || emit rust false
          test -f foundry.toml && emit foundry true || emit foundry false

  custom:
    name: Custom CI
    needs: detect
    if: needs.detect.outputs.custom == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Run repository CI hook
        shell: bash
        run: bash scripts/ci.sh

  node:
    name: Node.js CI
    needs: detect
    if: needs.detect.outputs.custom != 'true' && needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}

      - name: Select package manager
        id: package-manager
        shell: bash
        env:
          DEFAULT_PNPM_VERSION: ${{ inputs.pnpm-version }}
          DEFAULT_YARN_VERSION: ${{ inputs.yarn-version }}
          DEFAULT_BUN_VERSION: ${{ inputs.bun-version }}
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/package-manager.env
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const raw = typeof pkg.packageManager === 'string' ? pkg.packageManager.trim() : '';
          let manager = '';
          let version = '';
          if (raw) {
            const at = raw.lastIndexOf('@');
            manager = at > 0 ? raw.slice(0, at) : raw;
            version = at > 0 ? raw.slice(at + 1) : '';
          }
          console.log(`DECLARED_MANAGER=${manager}`);
          console.log(`DECLARED_VERSION=${version}`);
          NODE
          . /tmp/package-manager.env

          case "$DECLARED_MANAGER" in
            npm|pnpm|yarn|bun)
              manager="$DECLARED_MANAGER"
              version="$DECLARED_VERSION"
              ;;
            '')
              if test -f pnpm-lock.yaml; then
                manager=pnpm
                version="$DEFAULT_PNPM_VERSION"
              elif test -f yarn.lock; then
                manager=yarn
                version="$DEFAULT_YARN_VERSION"
              elif test -f bun.lockb || test -f bun.lock; then
                manager=bun
                version="$DEFAULT_BUN_VERSION"
              else
                manager=npm
                version=''
              fi
              ;;
            *)
              echo "Unsupported packageManager '$DECLARED_MANAGER'." >&2
              exit 1
              ;;
          esac

          if test "$manager" != npm && test -z "$version"; then
            case "$manager" in
              pnpm) version="$DEFAULT_PNPM_VERSION" ;;
              yarn) version="$DEFAULT_YARN_VERSION" ;;
              bun) version="$DEFAULT_BUN_VERSION" ;;
            esac
          fi

          printf 'manager=%s\n' "$manager" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          echo "Selected package manager: $manager${version:+@$version}"

      - name: Install declared npm version
        if: steps.package-manager.outputs.manager == 'npm' && steps.package-manager.outputs.version != ''
        shell: bash
        env:
          PACKAGE_MANAGER_VERSION: ${{ steps.package-manager.outputs.version }}
        run: |
          set -euo pipefail
          npm install --global "npm@$PACKAGE_MANAGER_VERSION"
          npm --version

      - name: Install Corepack when needed
        if: steps.package-manager.outputs.manager == 'pnpm' || steps.package-manager.outputs.manager == 'yarn'
        shell: bash
        env:
          COREPACK_VERSION: ${{ inputs.corepack-version }}
        run: |
          set -euo pipefail
          if ! command -v corepack >/dev/null 2>&1; then
            npm install --global "corepack@$COREPACK_VERSION"
          fi
          corepack enable

      - name: Activate pnpm
        if: steps.package-manager.outputs.manager == 'pnpm'
        shell: bash
        env:
          PACKAGE_MANAGER_VERSION: ${{ steps.package-manager.outputs.version }}
        run: |
          set -euo pipefail
          corepack prepare "pnpm@$PACKAGE_MANAGER_VERSION" --activate
          pnpm --version

      - name: Activate Yarn
        if: steps.package-manager.outputs.manager == 'yarn'
        shell: bash
        env:
          PACKAGE_MANAGER_VERSION: ${{ steps.package-manager.outputs.version }}
        run: |
          set -euo pipefail
          corepack prepare "yarn@$PACKAGE_MANAGER_VERSION" --activate
          yarn --version

      - name: Set up Bun
        if: steps.package-manager.outputs.manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.package-manager.outputs.version }}

      - name: Install dependencies
        shell: bash
        env:
          MANAGER: ${{ steps.package-manager.outputs.manager }}
        run: |
          set -euo pipefail
          case "$MANAGER" in
            pnpm)
              if test -f pnpm-lock.yaml; then pnpm install --frozen-lockfile; else pnpm install; fi
              ;;
            yarn)
              if test -f yarn.lock; then yarn install --immutable || yarn install --frozen-lockfile; else yarn install; fi
              ;;
            bun)
              if test -f bun.lockb || test -f bun.lock; then bun install --frozen-lockfile; else bun install; fi
              ;;
            npm)
              if test -f package-lock.json || test -f npm-shrinkwrap.json; then npm ci; else npm install; fi
              ;;
          esac

      - name: Run declared validation scripts
        shell: bash
        env:
          MANAGER: ${{ steps.package-manager.outputs.manager }}
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/ci-scripts.txt
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const wanted = ['lint', 'typecheck', 'test', 'build'];
          for (const name of wanted) if (pkg.scripts && pkg.scripts[name]) console.log(name);
          NODE

          while IFS= read -r script; do
            test -n "$script" || continue
            case "$MANAGER" in
              pnpm) pnpm run "$script" ;;
              yarn) yarn "$script" ;;
              bun) bun run "$script" ;;
              npm) npm run "$script" ;;
            esac
          done < /tmp/ci-scripts.txt

  php:
    name: PHP CI
    needs: detect
    if: needs.detect.outputs.custom != 'true' && needs.detect.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:v2
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -print0 | xargs -0 -r -n1 php -l
      - name: Run declared Composer scripts
        shell: bash
        run: |
          set -euo pipefail
          php -r '$p=json_decode(file_get_contents("composer.json"), true); foreach (["lint","test","build"] as $s) if (!empty($p["scripts"][$s])) echo $s, PHP_EOL;' > /tmp/composer-scripts.txt
          while IFS= read -r script; do
            test -n "$script" || continue
            composer run-script "$script"
          done < /tmp/composer-scripts.txt

  python:
    name: Python CI
    needs: detect
    if: needs.detect.outputs.custom != 'true' && needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Validate Python version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          if sys.version_info < (3, 8):
              raise SystemExit('Universal CI supports Python 3.8 or newer.')
          PY

      - name: Install dependencies and project when installable
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip

          install_project=false
          parser_path=''

          if test -f pyproject.toml; then
            if ! python -c 'import tomllib' >/dev/null 2>&1; then
              parser_path="$RUNNER_TEMP/universal-ci-tomli"
              rm -rf "$parser_path"
              python -m pip install \
                --disable-pip-version-check \
                --no-deps \
                --target "$parser_path" \
                'tomli==2.2.1'
            fi

            install_project="$({ PYTHONPATH="$parser_path" python - <<'PY'
          import sys
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib

          try:
              with open('pyproject.toml', 'rb') as f:
                  data = tomllib.load(f)
          except Exception as exc:
              print(f'Invalid pyproject.toml: {exc}', file=sys.stderr)
              raise

          print('true' if ('project' in data or 'build-system' in data) else 'false')
          PY
            } )"
          fi

          if test "$install_project" != true && test -f setup.py; then
            install_project=true
          fi

          if test -f requirements.txt; then python -m pip install -r requirements.txt; fi
          if test -f requirements-dev.txt; then python -m pip install -r requirements-dev.txt; fi

          if test "$install_project" = true; then
            python -m pip install .
          fi

      - name: Compile Python sources
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q . -x '(^|/)(\.git|\.venv|venv|build|dist|node_modules)/'
      - name: Run available checks
        shell: bash
        run: |
          set -euo pipefail
          if python -c 'import ruff' 2>/dev/null; then python -m ruff check .; fi
          if python -c 'import pytest' 2>/dev/null; then python -m pytest; fi

  go:
    name: Go CI
    needs: detect
    if: needs.detect.outputs.custom != 'true' && needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
      - run: go vet ./...
      - run: go test ./...

  rust:
    name: Rust CI
    needs: detect
    if: needs.detect.outputs.custom != 'true' && needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Rust project
        shell: bash
        run: |
          set -euo pipefail
          if test -f Cargo.lock; then
            cargo check --locked --all-targets --all-features
          else
            cargo check --all-targets --all-features
          fi
      - name: Run Rust tests
        shell: bash
        run: |
          set -euo pipefail
          if test -f Cargo.lock; then
            cargo test --locked --all-features
          else
            cargo test --all-features
          fi

  foundry:
    name: Foundry CI
    needs: detect
    if: needs.detect.outputs.custom != 'true' && needs.detect.outputs.foundry == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
      - run: forge build
      - run: forge test

  summary:
    name: Universal CI summary
    needs: [detect, custom, node, php, python, go, rust, foundry]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI result
        shell: bash
        env:
          DETECT: ${{ needs.detect.result }}
          CUSTOM: ${{ needs.custom.result }}
          NODE: ${{ needs.node.result }}
          PHP: ${{ needs.php.result }}
          PYTHON: ${{ needs.python.result }}
          GO: ${{ needs.go.result }}
          RUST: ${{ needs.rust.result }}
          FOUNDRY: ${{ needs.foundry.result }}
        run: |
          set -euo pipefail
          for result in "$DETECT" "$CUSTOM" "$NODE" "$PHP" "$PYTHON" "$GO" "$RUST" "$FOUNDRY"; do
            if test "$result" = failure || test "$result" = cancelled; then
              echo "Universal CI failed."
              exit 1
            fi
          done
          echo "Universal CI passed or no supported root-level project type was detected."
